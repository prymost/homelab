# Trivy configuration for repository-wide static analysis and misconfiguration scanning
# https://aquasecurity.github.io/trivy/latest/docs/configuration/config-file/

scan:
  skip-files:
    # Upstream FluxCD controller distribution manifests generated by the Flux CLI.
    # Flux controllers legitimately require cluster-level management of their own CRDs (*.toolkit.fluxcd.io)
    # and read access to secrets for Git/Helm auth. Hand-editing upstream manifests breaks reconciliation.
    - "clusters/homelab/flux-system/gotk-components.yaml"

    # Home Assistant requires a writable root filesystem for runtime dynamic Python wheel compilation
    # and init-container HACS package installation (apk add). Documented homelab operational exception.
    - "sandbox/home-assistant/deployment.yaml"

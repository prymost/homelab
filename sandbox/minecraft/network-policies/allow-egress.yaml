apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-dns-and-internet
  namespace: minecraft
spec:
  podSelector:
    matchLabels:
      app: minecraft
  policyTypes:
    - Egress
  egress:
    # Allow DNS lookups
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow access to the internet
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8       # RFC1918 Class A (includes k3s pod 10.42/16 & svc 10.43/16)
              - 172.16.0.0/12    # RFC1918 Class B
              - 192.168.0.0/16   # RFC1918 Class C (covers all homelab LAN subnets)
              - 169.254.0.0/16   # RFC3927 Link-Local / Cloud Metadata
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80


apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # --- Init Container for HACS Installation ---
      initContainers:
        - name: install-hacs
          image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ ! -d "/config/custom_components/hacs" ]; then
                echo "HACS not found. Installing..."
                # Install dependencies required by the HACS install script
                apk add --no-cache bash wget unzip
                # Run the HACS download script
                wget -O - https://get.hacs.xyz | bash -
              else
                echo "HACS already installed. Skipping."
              fi
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /config
              name: config
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.10.4@sha256:23f4dfbb69ce76315dbc4de7915504f1c2dcecd7ca2648113a493a385972e133
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8123
              name: http
              protocol: TCP
          env:
            - name: TZ
              value: "America/Los_Angeles"
          livenessProbe: # Restart if HA hangs
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 120
            periodSeconds: 60
          readinessProbe: # Don't route traffic or finish rollout until HA HTTP is up
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: 4Gi
              cpu: 1000m
          volumeMounts:
            - mountPath: /config
              name: config
            - name: home-assistant-config-volume
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: ha-config
        - name: home-assistant-config-volume
          configMap:
            name: home-assistant-config

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-k8s-api-egress
  namespace: nfs-provisioner
spec:
  podSelector:
    matchLabels:
      app: nfs-subdir-external-provisioner
  policyTypes:
    - Egress
  egress:
    # In-cluster API Service ClusterIP
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - protocol: TCP
          port: 443
    # Control plane master node direct endpoint (post-DNAT fallback):
    # k3s kube-router evaluates NetworkPolicy egress against the DNATed
    # destination, so the ClusterIP allow alone is rejected once rewritten
    # to the master node host endpoint (homelab1).
    - to:
        - ipBlock:
            cidr: 192.168.50.119/32
      ports:
        - protocol: TCP
          port: 6443

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nfs-egress
  namespace: nfs-provisioner
spec:
  podSelector:
    matchLabels:
      app: nfs-subdir-external-provisioner
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.50.42/32
      ports:
        - protocol: TCP
          port: 2049
        - protocol: UDP
          port: 2049
        - protocol: TCP
          port: 111
        - protocol: UDP
          port: 111

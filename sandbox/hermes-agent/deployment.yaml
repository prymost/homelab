apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: hermes-agent
  labels:
    app: hermes-agent
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/part-of: hermes-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent
      app.kubernetes.io/name: hermes-agent
  template:
    metadata:
      annotations:
        redeploy-reason: "enable google calendar integration and token synchronization"
      labels:
        app: hermes-agent
        app.kubernetes.io/name: hermes-agent
        app.kubernetes.io/part-of: hermes-agent
    spec:
      serviceAccountName: hermes-agent
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
        appArmorProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-volume-permissions
          image: alpine:3.21.3@sha256:a8560b36e8b8210634f77d9f7f9efd7ffa463e380b75e2e74aff4511df3ef88c
          command: ["/bin/sh", "-c"]
          args:
            - |
              chown -R -h 10000:10000 /opt/data && chmod 770 /opt/data
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
            seccompProfile:
              type: RuntimeDefault
            appArmorProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
      containers:
        - name: hermes-agent
          image: nousresearch/hermes-agent:stable@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
          command:
            - "/bin/sh"
            - "-c"
          args:
            - |
              /usr/local/bin/init-hermes-env && exec /opt/hermes/bin/hermes gateway run --no-supervise
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: HERMES_HOME
              value: "/opt/data"
            - name: HERMES_MANAGED_DIR
              value: "/etc/hermes-config"
            - name: HERMES_ACCEPT_HOOKS
              value: "1"
            - name: HOME
              value: "/opt/data"
            # Explicit least-privilege secret injection from hermes-agent-secrets
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secrets
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secrets
                  key: TELEGRAM_ALLOWED_USERS
            - name: TELEGRAM_HOME_CHANNEL
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secrets
                  key: TELEGRAM_ALLOWED_USERS
            - name: OPENCODE_GO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secrets
                  key: OPENAI_API_KEY
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secrets
                  key: TAVILY_API_KEY
                  optional: true
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secrets
                  key: GITHUB_APP_ID
                  optional: true
            - name: GITHUB_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secrets
                  key: GITHUB_INSTALLATION_ID
                  optional: true
            - name: LINQ_BUILDING_ID
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secrets
                  key: LINQ_BUILDING_ID
                  optional: true
            - name: LINQ_DISTRICT_ID
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secrets
                  key: LINQ_DISTRICT_ID
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            appArmorProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
            - name: hermes-managed-config
              mountPath: /etc/hermes-config
              readOnly: true
            - name: hermes-scripts
              mountPath: /usr/local/bin/mint-github-token
              subPath: mint-github-token
            - name: hermes-scripts
              mountPath: /usr/local/bin/init-hermes-env
              subPath: init-hermes-env
            - name: hermes-secrets
              mountPath: /etc/hermes-secrets
              readOnly: true
            - name: hermes-gcal-secrets
              mountPath: /etc/hermes-gcal-secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
      volumes:
        - name: hermes-data
          persistentVolumeClaim:
            claimName: hermes-agent-data
        - name: hermes-managed-config
          configMap:
            name: hermes-agent-config
            defaultMode: 0644
            items:
              - key: config.yaml
                path: config.yaml
        - name: hermes-scripts
          configMap:
            name: hermes-agent-config
            defaultMode: 0755
            items:
              - key: mint-github-token
                path: mint-github-token
              - key: init-hermes-env
                path: init-hermes-env
        - name: hermes-secrets
          secret:
            secretName: hermes-agent-secrets
            defaultMode: 0440
            optional: true
            items:
              - key: GITHUB_APP_PRIVATE_KEY
                path: github-app-private-key.pem
        - name: hermes-gcal-secrets
          secret:
            secretName: hermes-agent-gcal-secrets
            defaultMode: 0440
            optional: true
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-egress
  namespace: hermes-agent
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/part-of: hermes-agent
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8       # RFC1918 Class A (includes k3s pod 10.42/16 & svc 10.43/16)
              - 172.16.0.0/12    # RFC1918 Class B
              - 192.168.0.0/16   # RFC1918 Class C (covers all homelab LAN subnets, router, modem)
              - 100.64.0.0/10    # RFC6598 Carrier-Grade NAT / Tailscale overlay
              - 169.254.0.0/16   # RFC3927 Link-Local / Cloud Metadata
              - 127.0.0.0/8      # RFC1122 Loopback
              - 224.0.0.0/4      # Multicast
      ports:
        - protocol: TCP
          port: 443

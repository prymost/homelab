apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-config
  namespace: hermes-agent
  labels:
    app: hermes-agent
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/part-of: hermes-agent
data:
  config.yaml: |
    _config_version: 51

    timezone: "America/Los_Angeles"

    database:
      journal_mode: "delete"

    model:
      default: "glm-5.3-flash"
      provider: "opencode-go"
      base_url: "https://opencode.ai/zen/go/v1"
      aliases:
        # Model IDs verified against https://opencode.ai/zen/go/v1/models (2026-10-25)
        quick: "opencode-go/claude-haiku-5-5"
        research: "opencode-go/glm-5.3"
        deep: "opencode-go/deepseek-v4.1-flash"

    platform_toolsets:
      telegram:
        - web
        - file
        - skills
        - todo
        - terminal

    gateway:
      platforms:
        telegram:
          enabled: true

    agent:
      max_turns: 50

    terminal:
      env_passthrough:
        - LINQ_BUILDING_ID
        - LINQ_DISTRICT_ID

  init-hermes-env: |
    #!/opt/hermes/.venv/bin/python3
    """
    Hermes Agent Pre-Launch Initialization Hook.
    Executes synchronously before 'hermes gateway run' to ensure Git configuration
    and Google Calendar credentials are properly initialized without race conditions.
    """
    import os
    import shutil
    import subprocess
    import sys
    from pathlib import Path


    def setup_git_config() -> None:
        if os.path.exists("/usr/local/bin/mint-github-token"):
            try:
                subprocess.run(["/usr/local/bin/mint-github-token", "setup"], check=True)
            except Exception as e:
                sys.stderr.write(f"Warning: Git config setup failed: {e}\n")


    def sync_google_credentials() -> None:
        secret_dir = Path("/etc/hermes-gcal-secrets")
        cred_dir = Path("/run/google-credentials")
        data_dir = Path("/opt/data")

        # Fast-exit if Google Calendar secret volume is not mounted (clean up stale dangling links if any)
        if not (secret_dir / "google-token.json").is_file():
            for filename in ("google_client_secret.json", "google_token.json"):
                link = data_dir / filename
                if link.is_symlink() and not link.exists():
                    try:
                        link.unlink()
                    except OSError:
                        pass
            return

        cred_dir.mkdir(parents=True, exist_ok=True, mode=0o700)

        # Copy credentials into writable in-memory tmpfs (/run) and link to /opt/data
        for filename in ("google_client_secret.json", "google_token.json"):
            src = secret_dir / filename.replace("_", "-")
            mem = cred_dir / filename
            link = data_dir / filename

            if src.is_file():
                shutil.copyfile(src, mem)
                mem.chmod(0o600)
                if link.is_symlink() or link.exists():
                    link.unlink()
                link.symlink_to(mem)

        sys.stderr.write("Initialized Google Calendar credentials in memory-backed store.\n")


    def main() -> None:
        setup_git_config()
        try:
            sync_google_credentials()
        except Exception as e:
            sys.stderr.write(f"Warning: Failed to sync Google credentials: {e}\n")


    if __name__ == "__main__":
        main()

  mint-github-token: |
    #!/opt/hermes/.venv/bin/python3
    """
    GitHub App Authentication & Git Credential Helper for Hermes Agent.
    Mints short-lived installation access tokens using RS256 JWT signing.
    Enforces strict HTTPS and github.com host validation to prevent token exfiltration.
    """

    import json
    import os
    import subprocess
    import sys
    import time
    from typing import Any, Dict, Optional, Tuple
    import urllib.error
    import urllib.request
    import jwt


    def get_credentials() -> Tuple[str, str, str]:
        app_id = os.environ.get("GITHUB_APP_ID")
        installation_id = os.environ.get("GITHUB_INSTALLATION_ID")

        key_path = "/etc/hermes-secrets/github-app-private-key.pem"
        private_key = None
        if os.path.exists(key_path):
            with open(key_path, "r", encoding="utf-8") as f:
                private_key = f.read().strip()
        elif os.environ.get("GITHUB_APP_PRIVATE_KEY"):
            private_key = os.environ["GITHUB_APP_PRIVATE_KEY"].strip()

        if not app_id or not installation_id or not private_key:
            sys.stderr.write("Error: GITHUB_APP_ID, GITHUB_INSTALLATION_ID, or GitHub App Private Key is not set.\n")
            sys.exit(1)

        return app_id.strip(), installation_id.strip(), private_key


    def mint_installation_token(repository: Optional[str] = None) -> str:
        app_id, installation_id, private_key = get_credentials()

        now = int(time.time())
        iat = now - 60
        payload = {
            "iat": iat,
            "exp": iat + (10 * 60),  # Strictly 10 minutes from iat
            "iss": str(app_id),
        }

        encoded_jwt = jwt.encode(payload, private_key, algorithm="RS256")
        if isinstance(encoded_jwt, bytes):
            encoded_jwt = encoded_jwt.decode("utf-8")
        url = f"https://api.github.com/app/installations/{installation_id}/access_tokens"
        token_payload: Dict[str, Any] = {
            "permissions": {
                "contents": "write",
                "pull_requests": "write",
                "metadata": "read",
            },
        }

        # If a specific repository or GITHUB_REPOSITORIES env is set, scope the token;
        # otherwise omit "repositories" to grant access to all repositories on the installation.
        repo_scope = repository or os.environ.get("GITHUB_REPOSITORIES")
        if repo_scope:
            # Strip owner prefix if passed as owner/repo (GitHub expects repository names only)
            token_payload["repositories"] = [
                r.strip().split("/")[-1] for r in repo_scope.split(",") if r.strip()
            ]

        token_request_body = json.dumps(token_payload).encode("utf-8")

        req = urllib.request.Request(
            url,
            data=token_request_body,
            headers={
                "Authorization": f"Bearer {encoded_jwt}",
                "Accept": "application/vnd.github+json",
                "User-Agent": "hermes-agent",
                "Content-Type": "application/json",
            },
            method="POST",
        )

        try:
            with urllib.request.urlopen(req, timeout=15) as resp:
                data = json.loads(resp.read().decode())
                return data["token"]
        except urllib.error.HTTPError as e:
            sys.stderr.write(f"GitHub API HTTP error {e.code}: {e.read().decode()}\n")
            sys.exit(1)
        except Exception as e:
            sys.stderr.write(f"Error contacting GitHub API: {e}\n")
            sys.exit(1)


    def handle_git_credential_get() -> None:
        """Processes Git credential helper 'get' request according to Git Credential Protocol."""
        req: Dict[str, str] = {}
        for line in sys.stdin:
            line = line.strip()
            if not line:
                break
            if "=" in line:
                k, v = line.split("=", 1)
                req[k.strip()] = v.strip()

        host = req.get("host", "").lower()
        protocol = req.get("protocol", "").lower()

        # Anti-exfiltration check: strictly scope to https://github.com
        if host != "github.com" or protocol != "https":
            return

        # Extract repository name from path if provided by git credential protocol (e.g. prymost/foo.git)
        path = req.get("path", "").strip("/")
        repo_name = None
        if path:
            repo_name = path.split("/")[-1].removesuffix(".git")

        try:
            token = mint_installation_token(repo_name)
        except (Exception, SystemExit):
            return

        sys.stdout.write("username=x-access-token\n")
        sys.stdout.write(f"password={token}\n")


    def setup_git_config() -> None:
        try:
            app_id, _, _ = get_credentials()
        except SystemExit:
            sys.stderr.write("GitHub App credentials not configured; skipping git config setup.\n")
            return

        bot_name = "hermes-agent[bot]"
        bot_email = f"{app_id}+{bot_name}@users.noreply.github.com"
        subprocess.run(["git", "config", "--global", "user.name", bot_name], check=True)
        subprocess.run(["git", "config", "--global", "user.email", bot_email], check=True)
        # Clear existing helpers for github.com before registering to remain idempotent
        subprocess.run(["git", "config", "--global", "--unset-all", "credential.https://github.com.helper"], check=False)
        subprocess.run(["git", "config", "--global", "credential.useHttpPath", "true"], check=True)
        subprocess.run(["git", "config", "--global", "--add", "credential.https://github.com.helper", "cache --timeout=3300"], check=True)
        subprocess.run(["git", "config", "--global", "--add", "credential.https://github.com.helper", "/usr/local/bin/mint-github-token"], check=True)
        sys.stderr.write(f"Configured git identity ({bot_name} <{bot_email}>) and scoped credential helper.\n")


    def main() -> None:
        if len(sys.argv) > 1 and sys.argv[1] == "setup":
            setup_git_config()
            return

        if len(sys.argv) > 1 and sys.argv[1] == "get":
            handle_git_credential_get()
            return

        if len(sys.argv) > 1 and sys.argv[1] in ("store", "erase"):
            return

        if len(sys.argv) > 1 and sys.argv[1] in ("token", "--token", "--print-token"):
            repo_arg = sys.argv[2] if len(sys.argv) > 2 else None
            token = mint_installation_token(repo_arg)
            sys.stdout.write(f"{token}\n")
            return

        usage = (
            "Usage: mint-github-token <command> [args]\n\n"
            "Commands:\n"
            "  setup         Configure git identity and credential helper\n"
            "  get           Git credential helper protocol handler\n"
            "  store|erase   Git credential helper protocol hooks (no-op)\n"
            "  token [repo]  Mint installation token (all repos by default, or scoped to [repo])\n"
        )
        sys.stderr.write(usage)
        sys.exit(1)


    if __name__ == "__main__":
        main()

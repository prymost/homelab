apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-config
  namespace: hermes-agent
  labels:
    app: hermes-agent
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/part-of: hermes-agent
data:
  config.yaml: |
    _config_version: 51

    database:
      journal_mode: "delete"

    model:
      default: "glm-5.3-flash"
      provider: "custom"
      base_url: "https://opencode.ai/zen/go/v1"

    platform_toolsets:
      telegram:
        - web
        - file
        - skills
        - todo

    gateway:
      platforms:
        telegram:
          enabled: true
          home_channel:
            platform: "telegram"
            chat_id: "97322988"
            name: "Boris"

    agent:
      max_turns: 50

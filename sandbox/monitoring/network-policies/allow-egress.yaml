apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-runner-external-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: robusta-runner
  policyTypes:
    - Egress
  egress:
    # Allow egress to internet (sinks, webhooks, alert delivery)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8       # RFC1918 Class A (includes k3s pod 10.42/16 & svc 10.43/16)
              - 172.16.0.0/12    # RFC1918 Class B
              - 192.168.0.0/16   # RFC1918 Class C (covers all homelab LAN subnets)
              - 169.254.0.0/16   # RFC3927 Link-Local / Cloud Metadata
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 587
        - protocol: TCP
          port: 465
        - protocol: TCP
          port: 25

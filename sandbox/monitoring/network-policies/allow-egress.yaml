apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-runner-external-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: robusta-runner
  policyTypes:
    - Egress
  egress:
    # Allow egress to internet (sinks, webhooks, alert delivery)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16
              - 10.43.0.0/16
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 587
        - protocol: TCP
          port: 465
        - protocol: TCP
          port: 25

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-forwarder-to-runner
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: robusta-runner
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: robusta-forwarder
      ports:
        - protocol: TCP
          port: 5000
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-forwarder-egress-to-runner
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app: robusta-forwarder
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: robusta-runner
      ports:
        - protocol: TCP
          port: 5000
        - protocol: TCP
          port: 80

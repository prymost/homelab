---
- name: Configure GDM3 Auto-Login
  ini_file:
    path: /etc/gdm3/daemon.conf
    section: daemon
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
  loop:
    - { option: 'AutomaticLoginEnable', value: 'true' }
    - { option: 'AutomaticLogin', value: "{{ kiosk_user }}" }

- name: Disable Wi-Fi power saving in NetworkManager
  copy:
    dest: /etc/NetworkManager/conf.d/99-disable-wifi-powersave.conf
    content: |
      [connection]
      wifi.powersave = 2
    owner: root
    group: root
    mode: '0644'
  notify: Reload NetworkManager

- name: Ensure Firefox policy directory exists
  file:
    path: /etc/firefox/policies
    state: directory
    mode: '0755'

- name: Apply Firefox policies
  copy:
    src: firefox-policies.json
    dest: /etc/firefox/policies/policies.json
    mode: '0644'

- name: Ensure systemd user directories exist for kiosk user
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: '0755'
  loop:
    - "/home/{{ kiosk_user }}/.config/systemd"
    - "/home/{{ kiosk_user }}/.config/systemd/user"

- name: Get kiosk user UID
  command: "id -u {{ kiosk_user }}"
  register: kiosk_uid
  changed_when: false
  check_mode: false

- name: Check if graphical-session.target is active for kiosk user
  become: true
  become_user: "{{ kiosk_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ kiosk_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ kiosk_uid.stdout }}/bus"
  command: systemctl --user is-active graphical-session.target
  register: graphical_session_active
  changed_when: false
  failed_when: false
  check_mode: false

- name: Create Kiosk Firefox systemd user service
  copy:
    content: |
      [Unit]
      Description=Home Assistant Kiosk Firefox
      PartOf=graphical-session.target
      After=graphical-session.target
      StartLimitIntervalSec=0

      [Service]
      Environment=MOZ_USE_XINPUT2=1
      ExecStart=/usr/bin/firefox --kiosk 'http://ha.lan/family-dash/home'
      Restart=always
      RestartSec=2
      NoNewPrivileges=yes

      [Install]
      WantedBy=graphical-session.target
    dest: "/home/{{ kiosk_user }}/.config/systemd/user/kiosk-firefox.service"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: '0644'
  notify: Restart kiosk-firefox

- name: Enable and start Kiosk Firefox systemd user service
  become: true
  become_user: "{{ kiosk_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ kiosk_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ kiosk_uid.stdout }}/bus"
  systemd:
    name: kiosk-firefox
    scope: user
    daemon_reload: true
    enabled: true
    state: "{{ 'started' if graphical_session_active.rc == 0 else omit }}"
  register: kiosk_systemd_result
  failed_when: >-
    kiosk_systemd_result is failed and not (
      ansible_check_mode and
      'Could not find the requested service' in (kiosk_systemd_result.msg | default(''))
    )

- name: Disable GNOME Screen Sleep and Multi-Workspace
  become: true
  become_user: "{{ kiosk_user }}"
  dconf:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
  loop:
    - { key: "/org/gnome/desktop/session/idle-delay", value: "uint32 0" }
    - { key: "/org/gnome/settings-daemon/plugins/power/sleep-inactive-ac-timeout", value: "0" }
    - { key: "/org/gnome/mutter/dynamic-workspaces", value: "false" }
    - { key: "/org/gnome/desktop/wm/preferences/num-workspaces", value: "1" }

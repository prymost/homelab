kiosk_mode:
  admin_settings:
    hide_header: false
    hide_sidebar: false
  non_admin_settings:
    hide_header: true
    hide_sidebar: true
    ignore_entity_settings: true
views:
  - title: Home
    path: home
    type: custom:grid-layout
    layout:
      grid-template-columns: 3fr 1fr
      grid-template-rows: min-content 1fr 160px
      grid-gap: 0
      margin: 0
      padding: 5px
      grid-template-areas: |
        "header sidebar"
        "cal sidebar"
        "footer none"
    cards:
      - type: horizontal-stack
        square: false
        cards:
          - type: markdown
            content: >
              <h1>{{ now().strftime('%-I:%M %p') }}</h1> <h2>{{
              now().strftime('%A, %B %-d') }}</h2>
            card_mod:
              style:
                .: |
                  ha-card {
                    background: none !important;
                    border: none !important;
                    box-shadow: none !important;
                    padding: 0 0 0 0 !important;
                  }
                ha-markdown$: |
                  ha-markdown-element {
                    display: flex !important;
                    flex-direction: row !important; /* Forces side-by-side */
                    align-items: baseline !important; /* Aligns text bottom */
                    gap: 30px !important; /* Space between Time and Date */
                    padding: 0
                  }

                  /* Style the H1 (Time) */
                  h1 {
                    font-size: 4rem !important;
                    font-weight: 600 !important;
                    margin: 0 !important;
                    line-height: 1 !important;
                  }

                  /* Style the H2 (Date) */
                  h2 {
                    font-size: 2.2rem !important;
                    font-weight: 300 !important;
                    color: var(--secondary-text-color) !important;
                    margin: 0 !important;
                    white-space: nowrap;
                  }
          - type: button
            tap_action:
              action: toggle
            entity: input_boolean.calendar_view
            icon: mdi:calendar-month
            show_name: false
            card_mod:
              style: |
                :host {
                  flex: 0 0 60px !important;
                  max-width: 60px !important;
                }
      - type: vertical-stack
        view_layout:
          grid-area: cal
        cards:
          - type: conditional
            conditions:
              - entity: input_boolean.calendar_view
                state: "off"
            card:
              type: custom:week-planner-card
              showNavigation: true
              calendars:
                - entity: calendar.bo_cal
                  color: "#4285F4"
                  name: Dad
                - entity: calendar.nata_cal
                  color: "#ae9cce"
                  name: Mom
                - entity: calendar.family
                  color: "#f6bf26"
                  name: Family
                - entity: calendar.holidays_in_united_states
                  color: "#7e59f8"
                  name: US Holidays
                - entity: calendar.holidays_in_israel
                  color: "#c0fbcd"
                  name: Israel Holidays
              days: 7
              mode: week
              timeFormat: h:mm a
              border: false
              texts:
                fullDay: " "
              weather:
                showCondition: true
                showTemperature: true
                showLowTemperature: true
                useTwiceDaily: true
                entity: weather.kccr
              card_mod:
                style: |
                  ha-card {
                    height: 100% !important;
                    --days-spacing: 5px !important;
                    --events-margin-top: 5px !important;
                    --event-padding: 3px;

                    /* --- RESTORED WEATHER FIXES --- */
                    /* 1. Force Header to Stack (Date Top, Weather Bottom) */
                    .header {
                      display: flex !important;
                      flex-direction: column !important;
                      align-items: flex-start !important;
                      padding: 5px !important;
                      margin-bottom: 5px !important;
                    }

                    /* 2. Fix Weather Positioning (Stop Floating) */
                    .weather {
                      position: relative !important;
                      top: auto !important;
                      right: auto !important;
                      margin-top: 0px !important;
                      font-size: 0.85em !important;
                      font-weight: normal !important;
                      display: flex !important;
                    }

                    /* General Styles */
                    .event.past { opacity: .2; background-color: gray !important; }
                    .time { color: #333333 !important; font-size: 0.8em !important; }
                    .event {
                      color: #333333 !important;
                      padding: 1px 4px !important;
                      margin-bottom: 3px !important;
                      line-height: 1.1 !important;
                      background-color: var(--border-color) !important;
                      border-radius: 10px !important;
                      max-height: 80px !important;
                      overflow: hidden !important;
                      font-size: 1em !important;
                    }
                    .none { background-color: transparent !important; }
                    .today .number {
                       border-radius: 5px;
                       background-color: orange !important;
                       padding: 0 4px;
                    }
                    .day .date .number { font-size: 3em !important; font-weight: bold !important; }
                    .day { border: solid 1px #4a4a4a; padding: 0.2%; width: 13% !important; }
                  }
          - type: conditional
            conditions:
              - entity: input_boolean.calendar_view
                state: "on"
            card:
              type: custom:atomic-calendar-revive
              name: Month View
              enableModeChange: true
              defaultMode: Calendar
              maxDaysToShow: 30
              firstDayOfWeek: 1
              showDate: true
              disableCalLink: true
              entities:
                - entity: calendar.bo_cal
                  name: Dad
                  color: "#4285F4"
                - entity: calendar.nata_cal
                  name: Mom
                  color: "#ae9cce"
                - entity: calendar.family
                  name: Family
                  color: "#f6bf26"
                - entity: calendar.holidays_in_united_states
                  color: "#7e59f8"
                  name: US Holidays
                - entity: calendar.holidays_in_israel
                  color: "#c0fbcd"
                  name: Israel Holidays
              card_mod:
                style: >
                  ha-card {
                    height: 100% !important;
                    border: none !important;
                  }

                  .currentDay { background-color: #f6bf26 !important; color:
                  black !important; border-radius: 50%; }
